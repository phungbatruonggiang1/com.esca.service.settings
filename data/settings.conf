# esca-settingsd settings. Every line is optional; these are the defaults.

#wifi_interface = wlan0
#ethernet_interface = eth0

# Regulatory domain (ISO 3166 country code): which Wi-Fi channels and
# transmit powers are allowed. Applied when the Wi-Fi configuration file is
# first created.
#wifi_country = VN

# Where the joined Wi-Fi networks are kept, and where IP settings go.
#wpa_config = /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#network_dir = /etc/systemd/network

#log_level = INFO
