<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="vn.sparc.esca.Settings1"/>
    <allow send_destination="vn.sparc.esca.Settings1"/>
    <allow receive_sender="vn.sparc.esca.Settings1"/>
  </policy>

  <!-- Changing the board's network and radios is for the Settings app,
       which runs in this group; BlueZ (root) calls the pairing agent. -->
  <policy group="settings">
    <allow send_destination="vn.sparc.esca.Settings1"/>
    <allow receive_sender="vn.sparc.esca.Settings1"/>
  </policy>

  <policy context="default">
    <deny own="vn.sparc.esca.Settings1"/>
    <deny send_destination="vn.sparc.esca.Settings1"/>
  </policy>
</busconfig>
